name: Node.js security runtime check

on:
  pull_request:
    branches: [main]
    paths:
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/node-security.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: '.nvmrc'
      - run: node --version
      - run: npm run check
